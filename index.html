<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Горят уши по дням недели</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .container {
            background: white;
            border-radius: 20px;
            padding: 40px;
            max-width: 600px;
            width: 100%;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
        }

        h1 {
            color: #333;
            text-align: center;
            margin-bottom: 30px;
            font-size: 2em;
        }

        .day-selector {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(120px, 1fr));
            gap: 15px;
            margin-bottom: 30px;
        }

        .day-btn {
            padding: 15px;
            border: 2px solid #667eea;
            background: white;
            border-radius: 10px;
            cursor: pointer;
            transition: all 0.3s;
            font-size: 16px;
            font-weight: 600;
            color: #667eea;
        }

        .day-btn:hover {
            background: #667eea;
            color: white;
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(102, 126, 234, 0.4);
        }

        .day-btn.active {
            background: #667eea;
            color: white;
        }

        .ear-selector {
            display: flex;
            justify-content: center;
            gap: 20px;
            margin-bottom: 30px;
        }

        .ear-btn {
            padding: 15px 30px;
            border: 2px solid #764ba2;
            background: white;
            border-radius: 10px;
            cursor: pointer;
            transition: all 0.3s;
            font-size: 16px;
            font-weight: 600;
            color: #764ba2;
            min-width: 120px;
        }

        .ear-btn:hover {
            background: #764ba2;
            color: white;
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(118, 75, 162, 0.4);
        }

        .ear-btn.active {
            background: #764ba2;
            color: white;
        }

        .result {
            background: #f7f7f7;
            border-radius: 10px;
            padding: 25px;
            min-height: 100px;
            display: flex;
            align-items: center;
            justify-content: center;
            text-align: center;
            font-size: 18px;
            line-height: 1.6;
            color: #333;
        }

        .result.show {
            animation: fadeIn 0.5s;
        }

        @keyframes fadeIn {
            from {
                opacity: 0;
                transform: translateY(-10px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .footer {
            margin-top: 30px;
            text-align: center;
            color: #666;
            font-size: 14px;
        }

        @media (max-width: 600px) {
            .container {
                padding: 20px;
            }

            h1 {
                font-size: 1.5em;
            }

            .day-selector {
                grid-template-columns: repeat(2, 1fr);
            }

            .ear-selector {
                flex-direction: column;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>🔥 Горят уши по дням недели</h1>
        
        <div class="day-selector">
            <button class="day-btn" data-day="monday">Понедельник</button>
            <button class="day-btn" data-day="tuesday">Вторник</button>
            <button class="day-btn" data-day="wednesday">Среда</button>
            <button class="day-btn" data-day="thursday">Четверг</button>
            <button class="day-btn" data-day="friday">Пятница</button>
            <button class="day-btn" data-day="saturday">Суббота</button>
            <button class="day-btn" data-day="sunday">Воскресенье</button>
        </div>

        <div class="ear-selector">
            <button class="ear-btn" data-ear="left">Левое ухо</button>
            <button class="ear-btn" data-ear="right">Правое ухо</button>
        </div>

        <div class="result" id="result">
            Выберите день недели и ухо, чтобы узнать значение приметы
        </div>

        <div class="footer">
            Народная примета о горящих ушах
        </div>
    </div>

    <script>
        const meanings = {
            monday: {
                left: "Кто-то вас ругает или плохо о вас отзывается. Возможны неприятные разговоры на работе.",
                right: "Вас хвалят или хорошо о вас думают. Ожидайте приятных новостей."
            },
            tuesday: {
                left: "Будет неожиданная встреча с человеком из прошлого. Возможна ссора или конфликт.",
                right: "К веселью и радостным событиям. Удачный день для новых знакомств."
            },
            wednesday: {
                left: "Кто-то распускает о вас сплетни. Будьте осторожны в общении.",
                right: "Вас вспоминает любимый человек. К романтическому свиданию."
            },
            thursday: {
                left: "К неожиданным гостям или визиту. Приготовьтесь к сюрпризу.",
                right: "Скоро встретитесь с давним другом. К хорошим новостям."
            },
            friday: {
                left: "Вас обсуждают в негативном ключе. К мелким неприятностям.",
                right: "К любовному приключению или признанию в чувствах. Романтический день."
            },
            saturday: {
                left: "К ссоре с близкими людьми. Постарайтесь контролировать эмоции.",
                right: "К веселой вечеринке или празднику. День будет насыщенным."
            },
            sunday: {
                left: "Кто-то сильно скучает по вам. Стоит позвонить родным.",
                right: "К приятному сюрпризу и исполнению желания. Загадайте желание!"
            }
        };

        let selectedDay = null;
        let selectedEar = null;

        // Day buttons
        document.querySelectorAll('.day-btn').forEach(btn => {
            btn.addEventListener('click', function() {
                document.querySelectorAll('.day-btn').forEach(b => b.classList.remove('active'));
                this.classList.add('active');
                selectedDay = this.dataset.day;
                showResult();
            });
        });

        // Ear buttons
        document.querySelectorAll('.ear-btn').forEach(btn => {
            btn.addEventListener('click', function() {
                document.querySelectorAll('.ear-btn').forEach(b => b.classList.remove('active'));
                this.classList.add('active');
                selectedEar = this.dataset.ear;
                showResult();
            });
        });

        function showResult() {
            const resultDiv = document.getElementById('result');
            
            // Remove and re-add the animation class for consistent animation
            resultDiv.classList.remove('show');
            
            if (selectedDay && selectedEar) {
                const meaning = meanings[selectedDay]?.[selectedEar] || 'Значение не найдено';
                resultDiv.textContent = meaning;
            } else if (selectedDay && !selectedEar) {
                resultDiv.textContent = 'Теперь выберите, какое ухо горит';
            } else if (!selectedDay && selectedEar) {
                resultDiv.textContent = 'Выберите день недели';
            }
            
            // Trigger reflow to ensure animation plays
            const _ = resultDiv.offsetWidth;
            resultDiv.classList.add('show');
        }

        // Auto-select today
        const days = ['sunday', 'monday', 'tuesday', 'wednesday', 'thursday', 'friday', 'saturday'];
        const today = days[new Date().getDay()];
        const todayBtn = document.querySelector(`[data-day="${today}"]`);
        if (todayBtn) {
            todayBtn.click();
        }
    </script>
</body>
</html>
